model3d:
  # meshes and offsets are in the GDTF frame (head hangs towards -Z), not flipped to the body frame of 13.9
  kind: mesh
  parts:
    base:
      file: meshes/base.glb
      offset: [0.0, 0.0, 0.0]
    yoke:
      file: meshes/yoke.glb
      offset: [0.0, 0.0, -0.0756]
    head:
      file: meshes/head.glb
      offset: [0.0, 0.0, -0.3375]
