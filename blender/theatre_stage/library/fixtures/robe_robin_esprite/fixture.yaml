version: 1
id: robe_robin_esprite
manufacturer: "Robe Lighting"
model: "Robin Esprite"
family: moving_profile
sources:
  - {kind: gdtf, url: "source/Robe_Lighting@Robin_Esprite@2024-02-15__Animation_wheels_channel_sets_revision.gdtf", note: "Geometry tree, meshes, DMX modes, channel sets, gobo images."}
  - {kind: datasheet, url: "source/esprite_datasheet.pdf", note: "Robe ESPRITE datasheet (robe.cz, printed 2026-04-16): 28.2 kg, 443 x 264 x 733 mm, 150 mm output lens, 5.5-50 deg zoom, 27000 lm goniophotometer, CTO 3000-6700 K."}
  - {kind: datasheet, url: "https://robe.cz/api/robe/pdfs/en/product/651", note: "Download URL of the datasheet above."}
  - {kind: other, url: "https://www.robe.cz/res/downloads/user_manuals/User_manual_Robin_Esprite.pdf", note: "User manual v5.0 (19 MB, not copied): dimensions drawing p.45, framing shutter orientation p.19, DMX chart, photometric diagrams p.49."}
  - {kind: other, url: "https://www.robe.cz/esprite", note: "Product page; its download section lists no IES file, none found elsewhere."}

physical:
  weight: 28.2             # kg, datasheet (same value in the GDTF)
  dimensions:
    width: 0.443           # manual p.45, base width
    depth: 0.264           # manual p.45, head vertical
    height: 0.7324         # manual p.45 side view, head vertical; the mesh gives 0.735
  mount:
    hook_height: 0.055     # estimated: 11 mm Omega plate (base mesh above its origin) plus half a 48.3 mm tube and clamp, no Robe figure
    tilt_axis_height: 0.4131  # GDTF yoke + head offsets (75.6 + 337.5 mm); the manual p.45 drawing gives about 0.4215 from the base feet
optics:
  beam_type: profile
  lens_diameter: 0.150     # datasheet, output lens 150 mm
  lens_offset: 0.3106      # GDTF Beam offset in the head frame; the head mesh front face is at 0.3109
  flux: 27000              # lm, datasheet goniophotometer value (34000 integrating sphere); GDTF 27000
  field_angle: {min: 5.5, max: 50}  # datasheet zoom range; the beam is flat-field so field = beam, estimated: no 10% angle published
  beam_angle: {min: 5.5, max: 50}   # datasheet and manual p.49; GDTF gives 5 at the narrow end
  zoom_invert: true        # GDTF: DMX 0 = 50 deg, DMX max = narrow
  # no IES: none published on robe.cz
colour:
  systems: [cmy, cto]
  cto_kelvin: 3000         # datasheet and GDTF; white is 6500 K in the GDTF, 6700 K for the HP engine
motion:
  type: moving
  pan:
    min: -270.0
    max: 270.0
  tilt:
    min: -131.8
    max: 131.8   # GDTF 263.6 deg (DMX 0 = +131.8); manual and datasheet say 265; sign versus spec 13.9 unchecked
    invert: true
blades:
  count: 4
  mode: motorised
  gate_from_lens: 0.35     # estimated: head is 0.54 m long (0.229 behind, 0.311 ahead of the tilt axis), framing module in the rear half, no Robe figure
  span: 0.035              # estimated: gate image diameter 23.5 mm (manual gobo image) plus margin for the +-30 deg swivel
  travel: {open: 0.0125, closed: -0.005}  # estimated: gate radius 11.75 mm plus margin; blade covers 70% of the gate (GDTF Blade1A 0-0.7; the manual says 80%)
  sides: [270, 0, 90, 180]  # estimated: manual p.19 Robin style (1 bottom, 2 right, 3 top, 4 left) mapped through GDTF channel order 1,4,3,2; image up = +y_h, right = -x_h assumed
  angle_limit: 30          # manual and GDTF: swivel +-30 deg per blade
  rotation:
    min: -60.0
    max: 60.0              # GDTF ShaperRot, DMX 0 = +60
    invert: true
gobos:
  wheels:
    - name: gobo1
      rotation_range: 360
      slots:
        - {name: Open/hole, image: null, dmx: [0, 8]}
        - {name: Gobo1, image: gobos/15020378.png, dmx: [9, 17]}
        - {name: Gobo2, image: gobos/15020379.png, dmx: [18, 26]}
        - {name: Gobo3, image: gobos/15020380.png, dmx: [27, 35]}
        - {name: Gobo4, image: gobos/15020381.png, dmx: [36, 44]}
        - {name: Gobo5, image: gobos/15020382.png, dmx: [45, 53]}
        - {name: Gobo6, image: gobos/15020383.png, dmx: [54, 62]}
        - {name: Gobo7, image: gobos/15020384.png, dmx: [63, 71]}
        - {name: Gobo8, image: gobos/15020385.png, dmx: [72, 80]}
        - {name: Gobo9, image: gobos/15020386.png, dmx: [81, 91]}
    - name: gobo2
      rotation_range: 360
      slots:
        - {name: Open, image: null, dmx: [0, 3]}
        - {name: Gobo1, image: gobos/15020372.png, dmx: [4, 7]}
        - {name: Gobo2, image: gobos/15020373.png, dmx: [8, 11]}
        - {name: Gobo3, image: gobos/15020374.png, dmx: [12, 15]}
        - {name: Gobo4, image: gobos/15020375.png, dmx: [16, 19]}
        - {name: Gobo5, image: gobos/15020376.png, dmx: [20, 23]}
        - {name: Gobo6, image: gobos/15020377.png, dmx: [24, 27]}
        - {name: Gobo7, image: gobos/15040023.png, dmx: [28, 31]}
iris:
  min_ratio: 0.0
strobe:
  open: [32, 63]
  closed: [0, 31]
  strobe:
    from: 64
    to: 95
    hz_min: 0.3
    hz_max: 20.0
